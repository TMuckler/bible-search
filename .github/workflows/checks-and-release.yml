name: Tests and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-venv gir1.2-gtk-4.0 dbus
      - name: Run regression tests
        run: PYTHONPATH=src /usr/bin/python3 -m unittest discover -s tests -v
      - name: Check shell scripts
        run: bash -n scripts/install.sh scripts/uninstall.sh scripts/download-install.sh

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: /usr/bin/python3 scripts/build_release.py --tag "$RELEASE_TAG"
      - name: Publish tested assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: scripts/publish_release.sh
