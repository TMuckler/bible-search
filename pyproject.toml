[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bible-search"
version = "1.0.1"
description = "A resident native Bible passage launcher for Omarchy and Wayland"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["PyGObject>=3.46"]

[project.scripts]
bible-search = "bible_search.app:main"

[tool.setuptools.packages.find]
where = ["src"]
